name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        node: [20, 22, 24]
        # One Windows job, because the runner builds path keys and a baseline
        # frozen with backslashes matches nothing on the Linux CI that verifies
        # it. Three bugs lived here while every ubuntu job stayed green.
        include:
          - os: windows-latest
            node: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node test/run.mjs

  repo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The commit-surface ratchet judges the range this run introduces.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # This repository is both the plugin and the marketplace that indexes it.
      # A syntax error, a missing field, or a stale name fails at someone else's
      # `/plugin marketplace add`, on their machine, with no signal here.
      - name: Manifests, versions, skills, links and examples agree
        run: node test/repo.mjs
      # `validate .` reads the marketplace manifest only; the plugin manifest
      # and the skills are validated by naming them.
      - name: Plugin manifests and skills validate under the runtime's own rules
        run: |
          npx --yes @anthropic-ai/claude-code@latest plugin validate --strict .
          npx --yes @anthropic-ai/claude-code@latest plugin validate --strict .claude-plugin/plugin.json
          npx --yes @anthropic-ai/claude-code@latest plugin validate --strict skills
      - name: Ratchet, house style
        run: node .ratchet/ratchet.mjs house-style
      - name: Gate, commit message norms
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            echo "no base commit for this event, judging HEAD only"
            base="HEAD~1"
          fi
          node .ratchet/ratchet.mjs house-style --commits "$base..HEAD"
