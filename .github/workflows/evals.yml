name: Evals

# Runs the behavioral evals under evals/ against the plugin. Each run calls the
# model on the repository's credentials and is billed, so this is a manual
# workflow rather than a check on every push. Set ANTHROPIC_API_KEY in the
# repository secrets before dispatching it.
on:
  workflow_dispatch:
    inputs:
      threshold:
        description: Minimum with-plugin score, 0 to 1
        default: '0.8'

jobs:
  evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install -g @anthropic-ai/claude-code@latest
      - name: Run the eval suite
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          claude plugin eval . --trust-plugin --scaffold --no-publish \
            --json results.json --threshold "${{ inputs.threshold }}" \
            --judge-model sonnet --max-cost-usd 5
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results
          path: |
            results.json
            evals/results/
